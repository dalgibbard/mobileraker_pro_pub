name: mobileraker_pro
description: Obfuscated version of the pro lib of mobileraker
version: 2.6.7
homepage: mobileraker.com

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=3.16.5'

dependency_overrides:
  intl: any # required due to awesome notifications and formbuilder
  web: ^1.1.1

dependencies:
  flutter:
    sdk: flutter

  #packages maintained by mobileraker
  common:
    path: ../mobileraker/common

  firebase_core: ^4.15.2

  freezed_annotation: ^3.1.0
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3


  logger: ^1.4.0
  dio: ^5.3.3

  easy_localization: ^3.0.8

  flutter_spinkit: ^5.1.0
  progress_indicators: ^1.0.0
  flutter_slidable: ^3.0.0
  cached_network_image: ^3.3.0

  hive_ce: ^2.22.0
  uuid: ^4.5.1
  google_mobile_ads: ^9.1.0
  flutter_riverpod: ^3.3.2
  collection: ^1.18.0

  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  mockito: ^5.6.4
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.4



